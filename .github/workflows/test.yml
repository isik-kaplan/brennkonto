name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (pytest, 100% coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          SESSION_COOKIE_SECURE: "False"

  frontend:
    name: Frontend (vitest, 100% coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

  # Deploys only once both suites above are green, and only for master. Coolify's own push webhook
  # is switched off, so this is the one thing that ships a commit.
  deploy:
    name: Deploy to Coolify
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # One deploy at a time, in push order - a newer push waits rather than cancelling one mid-way.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Trigger the deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "https://infra.isik-kaplan.com/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false"
