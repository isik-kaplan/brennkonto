[project]
name = "brennkonto"
version = "0.25.2"
description = "Calorie and macro tracker backed by Open Food Facts."
authors = [
  { name = "Işık Kaplan", email = "isik.kaplan@outlook.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "litestar[standard,cryptography]>=2.13",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "python-dotenv>=1.0",
  "isik @ git+https://github.com/isik-kaplan/isik.git",
  "uuid6>=2025.0.1",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "hypothesis>=6.130.0",
  "respx>=0.22.0",
  "ruff>=0.9.0",
  "mutmut==3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 120
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Litestar's own idiom for query/header parameter metadata is a `Parameter(...)` call as
# the argument default (see app/controllers/*.py) - not the mutable-default footgun B008 guards
# against elsewhere.
ignore = ["B008"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["app"]
# Not under source_paths, so mutmut wouldn't otherwise copy them into the mutants/ tree it runs the
# suite in - conftest.py holds the per-test database reset, scripts/ the fingerprint helper the
# exemption tests import.
also_copy = ["scripts"]

[tool.coverage.run]
source = ["app", "scripts"]
branch = true
# A manual dev tool for filling a local database with fake history - it never ships and nothing
# depends on its output, so it's left unmeasured rather than tested.
omit = ["scripts/seed_demo_data.py"]
# SQLAlchemy's async engine bridges to its sync DBAPI drivers via greenlet_spawn - without this,
# coverage.py's tracer loses the thread the instant a controller awaits any db_session call,
# under-reporting every line after the first query in every handler that touches the database.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
